<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគ្រប់គ្រងសិស្ស CT</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="header-content">
            <img src="logo.png" alt="Logo" class="school-logo">
            <div class="school-name">
                <div>សាលាបឋមសិក្សាសម្តេចព្រះរាជអគ្គមហេសី</div>
                <div>នរោត្តមមុនីនាថសីហនុ</div>
            </div>
        </div>
        <h2 id="page-title">បញ្ជីរាយនាមសិស្សរៀន CT</h2>
    </header>

    <main id="main-content">
        <section id="home-page">
            <div class="summary-cards">
                <div class="card-summary shadow">
                    <i class="fas fa-users color-blue-icon"></i>
                    <div class="info">
                        <span class="label">សិស្សសរុប</span>
                        <span class="count" id="total-students">0</span>
                    </div>
                </div>
                <div class="card-summary shadow">
                    <i class="fas fa-venus color-pink-icon"></i>
                    <div class="info">
                        <span class="label">សរុបស្រី</span>
                        <span class="count" id="total-female">0</span>
                    </div>
                </div>
            </div>

            <div class="search-container">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="ស្វែងរកឈ្មោះសិស្ស..." onkeyup="filterData()">
                </div>
            </div>

            <div id="student-grid" class="student-grid">
                </div>
        </section>

        <section id="account-page" class="hidden">
            <div class="profile-card shadow">
                <div class="avatar"><i class="fas fa-user-circle"></i></div>
                <h3>ព័ត៌មានផ្ទាល់ខ្លួន</h3>
                <div class="profile-details">
                    <p><strong>អ្នកបង្កើត:</strong> ហម ម៉ាលីនដា</p>
                    <p><strong>លេខទូរសព្ទ:</strong> 017 751 115</p>
                    <a href="https://t.me/MalindaHorm" class="btn-telegram"><i class="fab fa-telegram"></i> Telegram</a>
                </div>
            </div>
        </section>
    </main>

    <div id="detail-modal" class="modal">
        <div class="modal-content shadow">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modal-body">
                </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')">
            <i class="fas fa-th-large"></i>
            <span>Home</span>
        </div>
        <div class="nav-item" onclick="switchTab('account')">
            <i class="fas fa-user"></i>
            <span>គណនី</span>
        </div>
    </nav>

    <script src="script.js"></script>
</body>
</html>
