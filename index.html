<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគ្រប់គ្រងសិស្ស CT</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="header-content">
            <img src="logo.png" alt="Logo" class="school-logo">
            <div class="school-name">
                <div>សាលាបឋមសិក្សាសម្តេចព្រះរាជអគ្គមហេសី</div>
                <div>នរោត្តមមុនីនាថសីហនុ</div>
            </div>
        </div>
        <h2 id="page-title">បញ្ជីរាយនាមសិស្សរៀន CT</h2>
    </header>

    <main id="main-content">
        <section id="home-page">
            <div class="summary-cards">
                <div class="card-summary shadow">
                    <i class="fas fa-users color-blue-icon"></i>
                    <div class="info">
                        <span class="label">សិស្សសរុប</span>
                        <span class="count" id="total-students">0</span>
                    </div>
                </div>
                <div class="card-summary shadow">
                    <i class="fas fa-venus color-pink-icon"></i>
                    <div class="info">
                        <span class="label">សរុបស្រី</span>
                        <span class="count" id="total-female">0</span>
                    </div>
                </div>
            </div>

            <div class="search-container">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="ស្វែងរកឈ្មោះសិស្ស..." onkeyup="filterData()">
                </div>
            </div>

            <div id="student-grid" class="student-grid">
                </div>
        </section>

        <section id="account-page" class="hidden">
            <div class="account-container">
                <div class="profile-header-card shadow">
                    <div class="profile-avatar">
                        <i class="fas fa-user-tie"></i>
                    </div>
                    <h3 class="profile-name">ហម ម៉ាលីនដា</h3>
                    <p class="profile-role">អ្នកបង្កើតប្រព័ន្ធ (Developer)</p>
                </div>

                <div class="contact-card shadow">
                    <h4 class="card-title">ព័ត៌មានទំនាក់ទំនង</h4>
                    
                    <div class="contact-item">
                        <div class="icon-box blue"><i class="fas fa-phone-alt"></i></div>
                        <div class="contact-info">
                            <span>លេខទូរស័ព្ទ</span>
                            <strong>017 751 115</strong>
                        </div>
                        <a href="tel:017751115" class="call-btn"><i class="fas fa-phone"></i></a>
                    </div>

                    <div class="contact-item">
                        <div class="icon-box telegram"><i class="fab fa-telegram-plane"></i></div>
                        <div class="contact-info">
                            <span>តេឡេក្រាម</span>
                            <strong>@MalindaHorm</strong>
                        </div>
                        <a href="https://t.me/MalindaHorm" target="_blank" class="call-btn tg"><i class="fas fa-paper-plane"></i></a>
                    </div>
                </div>

                <div class="info-footer">
                    <p>© 2026 រក្សាសិទ្ធិគ្រប់យ៉ាង</p>
                </div>
            </div>
        </section>
    </main>

    <div id="detail-modal" class="modal">
        <div class="modal-content shadow animate-pop">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </div>
        <div class="nav-item" onclick="switchTab('account')">
            <i class="fas fa-user-circle"></i>
            <span>គណនី</span>
        </div>
    </nav>

    <script src="script.js"></script>
</body>
</html>
